<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>포트캐리어 근무표</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b0d16">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="근무표">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#0b0d16;--card:#151a2e;--line:#262d47;--sub:#8a93ad;--day:#5468dc;--night:#a37a33;--rest:#a94452;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:#fff;font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",Roboto,sans-serif;padding:10px 12px 24px;max-width:640px;margin:0 auto}
h1{font-size:26px;margin:8px 4px 4px}.sub{color:var(--sub);margin:0 4px 16px;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:12px;margin-bottom:10px}
.lb{color:var(--sub);font-size:13px;margin-bottom:8px}
.btn{border:0;border-radius:18px;padding:14px;font-size:16px;font-weight:700;color:#fff;background:linear-gradient(135deg,#f0883a,#ea6a3a);cursor:pointer}
.btn.g{background:#0b0d16;border:1px solid var(--line);color:var(--sub)}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
.date{text-align:center;font-size:18px;font-weight:700}
.now{background:#0b0d16;border-radius:16px;padding:8px 12px;font-size:13px;color:var(--sub);margin-bottom:8px}.now b{color:#fff}
.sec{border-radius:16px;padding:12px;margin-top:10px;background:#0b0d16;border-left:5px solid}
.sec h3{margin:0 0 8px;font-size:14px}.sec small{color:var(--sub);font-weight:400}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--card);border-radius:12px;padding:8px 12px;margin:3px 6px 3px 0;font-weight:700}
.tm{background:linear-gradient(135deg,#f0883a,#ea6a3a);border-radius:8px;padding:1px 7px;font-size:12px}
.empty{color:var(--sub);font-size:14px}
.wrap{overflow-x:auto;margin:0 -6px}table{border-collapse:collapse;font-size:12px;text-align:center}
th,td{padding:5px 0;min-width:30px;border:1px solid var(--bg)}th{color:var(--sub);font-weight:500;cursor:pointer}
td.nm{position:sticky;left:0;background:var(--card);min-width:62px;font-weight:700;text-align:left;padding-left:6px;z-index:1}
td.c{border-radius:6px;font-weight:700;color:#fff;cursor:pointer}td.주{background:var(--day)}td.야{background:var(--night)}td.휴{background:var(--rest)}
.selc{outline:2px solid #fff;outline-offset:-2px}
input,select{width:100%;background:#0b0d16;color:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;font-size:16px;text-align:center}
.pr{display:grid;grid-template-columns:1.4fr .8fr .8fr auto;gap:6px;margin-bottom:8px}
.x{width:44px;border:0;border-radius:14px;background:#5c2b36;color:#fff;font-size:18px}
.warn{background:#3a2a14;color:#ffbe6b;border-radius:14px;padding:10px 12px;font-size:13px;margin:8px 0}
.hint{color:var(--sub);font-size:12px;line-height:1.5;margin:8px 0}
.tabs{display:flex;gap:8px;margin-bottom:14px}.tabs .btn{flex:1;padding:9px}.hide{display:none!important}td.c{position:relative}td[data-n]::after{content:attr(data-n);position:absolute;top:1px;right:1px;font-size:8px;line-height:1.2;background:#fff;color:#000;border-radius:4px;padding:0 2px;font-weight:700}table.sm{width:100%;border-collapse:collapse;font-size:13px}.sm th,.sm td{padding:3px 0;border:0;border-bottom:1px solid var(--line);cursor:default;text-align:center;font-weight:600}.sm th{color:var(--sub);font-weight:500}.sm td:first-child{text-align:left;color:#fff}#sh .sr .btn{width:auto;margin-top:0;padding:9px 0;font-size:14px;border-radius:14px}.sr{display:flex;gap:6px;margin-top:6px}.sr>*{flex:1}
:root{--me:#3ddc97}
td.nm.me{color:var(--me)}
td[data-e]::before{content:attr(data-e);position:absolute;bottom:1px;left:1px;font-size:8px;line-height:1.2;background:var(--me);color:#000;border-radius:4px;padding:0 2px;font-weight:700}
#crews{display:flex;gap:6px;margin-top:8px}#crews .sec{flex:1;margin-top:0;padding:8px;min-width:0;border-radius:14px}#crews h3{font-size:12px;margin:0 0 4px}#crews .chip{display:flex;padding:4px 7px;margin:3px 0;font-size:13px;flex-wrap:wrap;gap:4px}#crews .chip small{font-size:10px}
#v1 .row .btn{padding:8px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}.cal b{font-size:12px;color:var(--sub);text-align:center;font-weight:500}.cal b.r,.cal button.r{color:#ff6b6b}.cal button{border:0;border-radius:12px;background:#0b0d16;color:#fff;padding:9px 0;font-size:14px}.cal button.t{outline:1px solid var(--sub)}.cal button.s{background:linear-gradient(135deg,#f0883a,#ea6a3a);color:#fff}.ov{box-shadow:inset 0 -3px 0 #fff}#grid{border-collapse:separate;border-spacing:0}#grid th,#grid td{border:1px solid var(--bg)}#grid td.nm{border-right:1px solid var(--line)}#grid tr:first-child th:first-child{position:sticky;left:0;background:var(--card);z-index:1}#sh{position:fixed;inset:0;background:#000a;display:flex;align-items:flex-end;justify-content:center;z-index:50}#sh .box{background:var(--card);border-radius:24px 24px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px));width:100%;max-width:640px}#sh .btn{width:100%;margin-top:8px}
</style></head><body>

<div class="tabs"><button id="t1" class="btn" onclick="tab(1)">근무표</button><button id="t3" class="btn g" onclick="tab(3)">월급</button><button id="t2" class="btn g" onclick="tab(2)">조편성</button></div>
<div id="v1">
<div class="card">
  <div class="now" id="now"></div>
  <div class="row"><button class="btn g" onclick="mv(-1)">‹</button><div class="date" id="dt" onclick="openCal()" style="cursor:pointer"></div><button class="btn g" onclick="mv(1)">›</button></div>
  <button class="btn hide" id="td" style="width:100%;margin-top:8px;padding:10px" onclick="goToday()">오늘로 돌아가기</button>
  <div id="crews"></div>
</div>

<div class="card"><div class="lb" id="mt"></div><div class="wrap"><table id="grid"></table></div><div id="sum"></div><button class="btn" id="xl" style="width:100%;margin-top:12px" onclick="xlsx()">엑셀 파일로 저장</button></div>
</div>
<div id="v3" class="hide"><div class="card"><div class="lb">월급</div><div class="empty">준비 중이에요. 내용은 나중에 추가할게요.</div></div></div>
<div id="v2" class="hide">

<div class="card">
  <div class="lb">근무자 · 조편성 수정</div>
  <div id="meline" class="lb"></div>
  <div id="warn"></div>
  <div id="ppl"></div>
  <button class="btn g" style="width:100%" onclick="add()">+ 근무자 추가</button>
  <div class="hide"><div class="lb" style="margin-top:16px">패턴 설정</div>
  <div class="row"><div><div class="lb">기준일</div><input type="date" id="an" onchange="cfg('anchor',this.value)"></div></div>
  <div class="row" style="margin-top:8px">
    <div><div class="lb">주간 일수</div><input type="number" min="1" id="cd" onchange="cfg('d',+this.value)"></div>
    <div><div class="lb">야간 일수</div><input type="number" min="1" id="cn" onchange="cfg('n',+this.value)"></div>
    <div><div class="lb">휴무 일수</div><input type="number" min="0" id="cr" onchange="cfg('r',+this.value)"></div>
  </div>
  <p class="hint">순번 = 기준일에 그 사람이 근무 사이클의 몇 번째 날인지(0부터). 엑셀 기준은 주4·야4·휴2(10일 주기)이고 5명이 2일 간격(0, 2, 4, 6, 8)이에요. 신입은 비는 순번을 넣고, 위쪽 경고가 없어질 때까지 조정하세요.</p>
  <button class="btn g" style="width:100%" onclick="if(confirm('엑셀 기준 초기값으로 되돌릴까요?')){S=JSON.parse(JSON.stringify(DEF));fix();save();render()}">초기값으로 되돌리기</button></div>
</div>
</div>

<div id="sh" class="hide" onclick="if(event.target===this&&meOk())closeSh()"><div class="box" id="shb"></div></div>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<script>
const DEF={anchor:'2026-10-08',d:4,n:4,r:2,people:[{name:'우종길',team:'A',off:0},{name:'장신천',team:'A',off:2},{name:'박성일',team:'C',off:4},{name:'조은규',team:'B',off:6},{name:'박종성',team:'B',off:8}]};
const DOW=['일','월','화','수','목','금','토'],$=s=>document.querySelector(s);
let S=load();fix();
let ME=null;try{ME=localStorage.getItem('shift_me')}catch(e){}
function fix(){S.ov=S.ov||{};S.nt=S.nt||{};S.ea=S.ea||{};S.people.forEach((p,i)=>{if(!p.id)p.id='p'+i+Math.random().toString(36).slice(2,7)});save()}
function load(){try{const j=localStorage.getItem('shift_v1');if(j)return JSON.parse(j)}catch(e){}return JSON.parse(JSON.stringify(DEF))}
function save(){try{localStorage.setItem('shift_v1',JSON.stringify(S))}catch(e){}}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function ds(t){return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0')}
function todayStr(){return ds(new Date())}
function dn(s){const[a,b,c]=s.split('-').map(Number);return Math.round(Date.UTC(a,b-1,c)/864e5)}
function fd(n){return new Date(n*864e5).toISOString().slice(0,10)}
function dow(n){return DOW[new Date(n*864e5).getUTCDay()]}
const HOL={'2026-01-01':'신정','2026-02-16':'설날연휴','2026-02-17':'설날','2026-02-18':'설날연휴','2026-03-01':'삼일절','2026-03-02':'대체공휴일','2026-05-01':'노동절','2026-05-05':'어린이날','2026-05-24':'부처님오신날','2026-05-25':'대체공휴일','2026-06-03':'지방선거','2026-06-06':'현충일','2026-08-15':'광복절','2026-08-17':'대체공휴일','2026-09-24':'추석연휴','2026-09-25':'추석','2026-09-26':'추석연휴','2026-10-03':'개천절','2026-10-05':'대체공휴일','2026-10-09':'한글날','2026-12-25':'성탄절','2027-01-01':'신정','2027-02-06':'설날연휴','2027-02-07':'설날','2027-02-08':'설날연휴','2027-02-09':'대체공휴일','2027-03-01':'삼일절','2027-05-01':'노동절','2027-05-03':'대체공휴일','2027-05-05':'어린이날','2027-05-13':'부처님오신날','2027-06-06':'현충일','2027-07-17':'제헌절','2027-07-19':'대체공휴일','2027-08-15':'광복절','2027-08-16':'대체공휴일','2027-09-14':'추석연휴','2027-09-15':'추석','2027-09-16':'추석연휴','2027-10-03':'개천절','2027-10-04':'대체공휴일','2027-10-09':'한글날','2027-10-11':'대체공휴일','2027-12-25':'성탄절','2027-12-27':'대체공휴일'};
const di=x=>((x+4)%7+7)%7,isOff=x=>{const d=di(x);return d===0||d===6||!!HOL[fd(x)]};
const nmf=p=>p.id===ME?`<b style="color:var(--me)">${esc(p.name)}</b>`:esc(p.name);
const meOk=()=>S.people.some(p=>p.id===ME);
let NOOV=false;
function st(p,n){const o=!NOOV&&S.ov&&S.ov[p.id+'|'+n];return o||base(p,n)}
function base(p,n){const L=S.d+S.n+S.r,i=(((n-dn(S.anchor)+(+p.off||0))%L)+L)%L;return i<S.d?'주':i<S.d+S.n?'야':'휴'}
const crew=(k,n)=>S.people.filter(p=>st(p,n)===k);
const chip=p=>{const k=p.id+'|'+dn(sel),h=S.nt[k],e=S.ea[k],me=p.id===ME;return `<span class="chip"${me?' style="outline:1.5px solid var(--me)"':''}><b class="tm">${esc(p.team)}</b><span${me?' style="color:var(--me)"':''}>${esc(p.name)}</span>${e?`<small style="color:var(--me);font-weight:500">조출 ${e}h</small>`:''}${h?`<small style="color:var(--sub);font-weight:500">조퇴 ${h}h</small>`:''}</span>`};
const list=a=>a.length?a.map(chip).join(''):'<span class="empty">없음</span>';
let sel=todayStr(),gs=todayStr(),SCX=dn(todayStr());
function setSel(v){if(!v)return;sel=v;const x=dn(v);if(x<dn(gs)-31||x>dn(gs)+31)gs=v;SCX=x;render()}
function goToday(){sel=gs=todayStr();SCX=dn(sel);render()}
function mv(k){setSel(fd(dn(sel)+k))}
function pick(s){sel=s;render()}
function upd(i,k,v){S.people[i][k]=v;save();render()}
function add(){S.people.push({name:'신입',team:'C',off:0,id:'p'+Date.now()});save();render()}
function del(i){if(confirm(S.people[i].name+' 님을 삭제할까요?')){S.people.splice(i,1);save();render()}}
function cfg(k,v){if(k!=='anchor'&&!(v>=0))return;S[k]=v;save();render()}
function render(){
  const n=dn(sel),t=new Date(),h=t.getHours(),tn=dn(todayStr());
  const nowTxt=h<7?`야간 근무 중 (어제 야간조)`:h<19?'주간 근무 중':'야간 근무 중';
  const nc=h<7?crew('야',tn-1):h<19?crew('주',tn):crew('야',tn);
  $('#now').innerHTML=`<div style="display:flex;justify-content:space-between;gap:12px"><div>지금은 <b>${nowTxt}</b><br>${nc.map(nmf).join(', ')||'없음'}</div><div style="text-align:right">오늘 야간 예정<br>${crew('야',tn).map(nmf).join(', ')||'없음'}</div></div>`;
  $('#dt').textContent=`📅 ${sel.slice(5).replace('-','월 ')}일 (${dow(n)})${HOL[sel]?' · '+HOL[sel]:''}`;$('#td').classList.toggle('hide',sel===todayStr());
  $('#crews').innerHTML=[['주간','07~19','주','var(--day)'],['야간','19~07','야','var(--night)'],['휴무','','휴','var(--rest)']]
    .map(([a,b,k,c])=>`<div class="sec" style="border-color:${c}"><h3>${a} <small>${b}</small></h3>${list(crew(k,n))}</div>`).join('');
  const g0=dn(gs)-31,W=63;
  $('#mt').textContent='근무표 (칸을 누르면 변경 · 조퇴 기록)';
  let hd='<tr><th></th>',bd=S.people.map(p=>`<tr><td class="nm${p.id===ME?' me':''}">${esc(p.name)}</td>`);
  for(let i=0;i<W;i++){const x=g0+i,c=x===n?' selc':'',t=new Date(x*864e5),mo=t.getUTCMonth()+1,dd=t.getUTCDate();
    hd+=`<th class="${c}" data-x="${x}" style="${x===tn?'color:#f0883a':isOff(x)?'color:#ff6b6b':''}" onclick="pick('${fd(x)}')"><small style="display:block;font-size:9px;color:#fff">${i===0||dd===1?mo+'월':'&nbsp;'}</small>${dd}<br>${dow(x)}</th>`;
    S.people.forEach((p,j)=>{const s=st(p,x),k=p.id+'|'+x,o=S.ov[k]?' ov':'',nt=S.nt[k],ea=S.ea[k];bd[j]+=`<td class="c ${s}${c}${o}"${nt?` data-n="-${nt}h"`:''}${ea?` data-e="+${ea}h"`:''} onclick="sheet(${j},${x})">${s}</td>`})}
  const w=document.querySelector('.wrap'),prev=w.scrollLeft;
  $('#grid').innerHTML=hd+'</tr>'+bd.map(r=>r+'</tr>').join('');
  if(w.offsetParent!==null){if(SCX!=null){const th=document.querySelector('#grid th[data-x="'+SCX+'"]'),fw=document.querySelector('#grid th').offsetWidth;if(th)w.scrollLeft=th.offsetLeft-fw;SCX=null}else w.scrollLeft=prev}
  const d0=new Date(sel.slice(0,7)+'-01T00:00:00Z'),f=Math.round(d0/864e5),dim=new Date(Date.UTC(d0.getUTCFullYear(),d0.getUTCMonth()+1,0)).getUTCDate();
  let sm=`<div class="lb" style="margin:12px 0 4px">${d0.getUTCFullYear()}년 ${d0.getUTCMonth()+1}월 요약</div><table class="sm"><tr><th>이름</th><th>주간</th><th>야간</th><th>휴무</th><th>조퇴</th><th>조출</th></tr>`;
  S.people.forEach(p=>{const c={주:0,야:0,휴:0};let e=0,a=0;for(let i=0;i<dim;i++){const x=f+i,k=p.id+'|'+x;c[st(p,x)]++;e+=S.nt[k]||0;a+=S.ea[k]||0}sm+=`<tr><td style="${p.id===ME?'color:var(--me)':''}"><b>${esc(p.name)}</b></td><td style="color:var(--day)">${c.주}일</td><td style="color:var(--night)">${c.야}일</td><td style="color:var(--rest)">${c.휴}일</td><td>${e?e+'h':'-'}</td><td>${a?a+'h':'-'}</td></tr>`});
  $('#sum').innerHTML=sm+'</table>';
  const L=S.d+S.n+S.r;let bad=0;NOOV=true;
  for(let i=0;i<L;i++){const x=dn(S.anchor)+i;if(crew('주',x).length!==2||crew('야',x).length!==2)bad++}
  NOOV=false;$('#warn').innerHTML=bad?`<div class="warn">주간·야간이 2명이 아닌 날이 한 사이클(${L}일) 중 ${bad}일 있어요. 순번을 조정해 주세요.</div>`:'';
  $('#ppl').innerHTML='<div class="pr lb"><span>이름</span><span>조</span><span>순번</span><span></span></div>'+S.people.map((p,i)=>`<div class="pr"><input value="${esc(p.name)}" onchange="upd(${i},'name',this.value)"><select onchange="upd(${i},'team',this.value)">${['A','B','C','D'].map(o=>`<option${o===p.team?' selected':''}>${o}</option>`).join('')}</select><input type="number" min="0" max="${L-1}" value="${p.off}" onchange="upd(${i},'off',+this.value)"><button class="x" onclick="del(${i})">×</button></div>`).join('');
  $('#an').value=S.anchor;$('#cd').value=S.d;$('#cn').value=S.n;$('#cr').value=S.r;
  const me=S.people.find(p=>p.id===ME);$('#meline').innerHTML=`내 이름: <b style="color:var(--me)">${me?esc(me.name):'-'}</b> <button class="btn g" style="padding:4px 10px;margin-left:8px;font-size:12px" onclick="askMe()">변경</button>`;if(!me&&S.people.length)askMe();
}
function sheet(j,x){const p=S.people[j],k=p.id+'|'+x,b=base(p,x),cur=st(p,x),h=S.nt[k]||0,e=S.ea[k]||0;
  const hrs=(fn,cv)=>`<div class="sr">`+[0,1,2,3,4].map(v=>`<button class="btn g" style="${cv===v?'outline:2px solid #fff;color:#fff':''}" onclick="${fn}(${j},${x},${v})">${v?v+'h':'없음'}</button>`).join('')+`</div>`;
  $('#shb').innerHTML=`<div style="font-size:14px;font-weight:700">${esc(p.name)} · ${fd(x).slice(5).replace('-','월 ')}일 (${dow(x)})</div><div class="sr">`+[['주','주간','var(--day)'],['야','야간','var(--night)'],['휴','휴무','var(--rest)']].map(([kk,l,c])=>`<button class="btn" style="background:${c}${cur===kk?';outline:2px solid #fff':''}" onclick="setOv(${j},${x},'${kk}')">${l}</button>`).join('')+`<button class="btn g" onclick="setOv(${j},${x},'')">원래(${b})</button></div><div class="lb" style="margin:10px 0 0;font-size:12px">일찍 퇴근</div>`+hrs('setNote',h)+`<div class="lb" style="margin:10px 0 0;font-size:12px">일찍 출근</div>`+hrs('setEa',e);
  $('#sh').classList.remove('hide')}
function setEa(j,x,v){const k=S.people[j].id+'|'+x;if(v)S.ea[k]=v;else delete S.ea[k];save();closeSh();render()}
function askMe(){$('#shb').innerHTML='<div style="font-size:15px;font-weight:700">누구세요?</div><div class="lb" style="margin:4px 0 6px">내 이름을 고르면 표에서 색깔로 보여줘요</div>'+S.people.map(p=>`<button class="btn g" style="display:block;width:100%;margin-top:6px;padding:12px" onclick="setMe('${p.id}')">${esc(p.name)} <small>${esc(p.team)}조</small></button>`).join('');$('#sh').classList.remove('hide')}
function setMe(id){ME=id;try{localStorage.setItem('shift_me',id)}catch(e){}closeSh();render()}
let calY=0,calM=0;
function openCal(){const t=new Date(sel+'T00:00:00Z');calY=t.getUTCFullYear();calM=t.getUTCMonth();drawCal()}
function calGo(k){calM+=k;if(calM<0){calM=11;calY--}if(calM>11){calM=0;calY++}drawCal()}
function calPick(v){closeSh();setSel(v)}
function drawCal(){const f=Math.round(Date.UTC(calY,calM,1)/864e5),dim=new Date(Date.UTC(calY,calM+1,0)).getUTCDate(),w0=di(f),tdy=todayStr(),hl=[];
  let h=`<div class="sr" style="align-items:center"><button class="btn g" onclick="calGo(-1)">‹</button><div style="flex:2;text-align:center;font-weight:700">${calY}년 ${calM+1}월</div><button class="btn g" onclick="calGo(1)">›</button></div><div class="cal">`+['일','월','화','수','목','금','토'].map((d,i)=>`<b class="${i%6?'':'r'}">${d}</b>`).join('');
  for(let i=0;i<w0;i++)h+='<span></span>';
  for(let d=1;d<=dim;d++){const x=f+d-1,v=fd(x);if(HOL[v])hl.push((calM+1)+'/'+d+' '+HOL[v]);h+=`<button class="${isOff(x)?'r ':''}${v===sel?'s ':''}${v===tdy?'t':''}" onclick="calPick('${v}')">${d}</button>`}
  h+='</div>'+(hl.length?`<div class="lb" style="margin:8px 0 0;font-size:12px;color:#ff6b6b">${hl.join(' · ')}</div>`:'');
  $('#shb').innerHTML=h;$('#sh').classList.remove('hide')}
function setOv(j,x,k){const p=S.people[j],key=p.id+'|'+x;if(!k||k===base(p,x))delete S.ov[key];else S.ov[key]=k;save();closeSh();render()}
function closeSh(){$('#sh').classList.add('hide')}
function tab(k){[1,2,3].forEach(i=>{$('#v'+i).classList.toggle('hide',i!==k);$('#t'+i).className='btn'+(i===k?'':' g')});if(k===1){SCX=dn(sel);render()}}
const DL={async save({filename,data}){const type='application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',blob=new Blob([data],{type}),file=new File([blob],filename,{type});if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file]});return}catch(e){if(e&&e.name==='AbortError')return}}const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}};
async function xlsx(){
  if(!DL||!window.ExcelJS){alert('이 화면에서는 저장할 수 없어요');return}
  const wb=new ExcelJS.Workbook(),ws=wb.addWorksheet('근무표'),base=new Date(sel.slice(0,7)+'-01T00:00:00Z');
  const FILL={주:'FFFFFF00',야:'FF558ED5',휴:'FFFF0000',h:'FFD9D9D9'},bd={style:'thin',color:{argb:'FF000000'}},B={top:bd,left:bd,bottom:bd,right:bd};
  const put=(row,col,v,fill,bold)=>{const c=ws.getCell(row,col);c.value=v;c.border=B;c.alignment={horizontal:'center',vertical:'middle'};if(fill)c.fill={type:'pattern',pattern:'solid',fgColor:{argb:fill}};if(bold)c.font={bold:true}};
  let r=1;
  for(let k=0;k<2;k++){
    const d0=new Date(Date.UTC(base.getUTCFullYear(),base.getUTCMonth()+k,1)),f=Math.round(d0/864e5),dim=new Date(Date.UTC(d0.getUTCFullYear(),d0.getUTCMonth()+1,0)).getUTCDate();
    ws.mergeCells(r,1,r,dim+1);const t=ws.getCell(r,1);t.value='포트 캐리어 임시근무표 ('+(d0.getUTCMonth()+1)+'월)';t.font={bold:true,size:16};t.alignment={horizontal:'center'};
    r++;put(r,1,'날짜',FILL.h,1);put(r+1,1,'요일',FILL.h,1);
    S.people.forEach((p,j)=>put(r+2+j,1,p.name,null,1));
    for(let i=0;i<dim;i++){const x=f+i;put(r,i+2,fd(x).slice(5),FILL.h);put(r+1,i+2,dow(x),FILL.h);S.people.forEach((p,j)=>{const s=st(p,x);put(r+2+j,i+2,s,FILL[s]);const nt=S.nt[p.id+'|'+x],ea=S.ea[p.id+'|'+x];if(nt||ea)ws.getCell(r+2+j,i+2).note=(ea?'조출 '+ea+'시간 ':'')+(nt?'조퇴 '+nt+'시간':'')})}
    r+=S.people.length+4;
  }
  ws.getColumn(1).width=10;for(let c=2;c<=32;c++)ws.getColumn(c).width=6.5;
  const buf=await wb.xlsx.writeBuffer();
  try{await DL.save({filename:'포트캐리어_근무표.xlsx',data:buf})}catch(e){if(!e||e.code!=='declined')alert('저장하지 못했어요')}
}
render();setInterval(()=>{try{document.activeElement.tagName==='BODY'&&render()}catch(e){}},60000);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
